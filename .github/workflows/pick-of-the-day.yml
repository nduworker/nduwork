name: pick-of-the-day

# Daily: pick a starred repo and have the local Qwen on my workstation runner
# write why I like it, then commit pick.json (Pages redeploys on push).
on:
  schedule:
    # ~06:23 America/Los_Angeles. Off the top of the hour: GitHub drops
    # scheduled runs under load and :00 is the busiest slot.
    - cron: "23 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pick-of-the-day
  cancel-in-progress: false

jobs:
  pick:
    runs-on: [self-hosted, macOS, ARM64, nduwork]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Self-test
        run: python3 scripts/pick.py --selftest

      - name: Pick and summarize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen3.8:27b' }}
          OLLAMA_URL: ${{ vars.OLLAMA_URL || 'http://localhost:11434/v1/chat/completions' }}
        run: python3 scripts/pick.py

      - name: Commit pick.json
        run: |
          set -euo pipefail
          git diff --quiet -- pick.json && { echo "no change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pick.json
          git commit -m "chore(pick): $(python3 -c 'import json;print(json.load(open("pick.json"))["repo"])')"
          git push
